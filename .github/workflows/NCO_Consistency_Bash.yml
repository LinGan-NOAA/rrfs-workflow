# Workflow display name shown in GitHub Actions UI and matched by Reporter.
name: NCO_Consistency_Bash

# Define supported triggers for direct runs and centralized workflow_call.
on:
  # Run on pushes to repository branches.
  push:
  # Run on pull requests (including external forks) with read-only permissions.
  pull_request:
  # Allow consumer repos (e.g., GFS) to invoke this central workflow safely.
  workflow_call:
    inputs:
      # Optional path to consumer repo Bash exclusion list file.
      exclude_file:
        description: "Relative path to Bash exclusion list file."
        required: false
        type: string
        default: ".github/workflows/exclude_file_list_Bash.lst"
      # Optional ShellCheck source search path (-P) for consumer repos.
      source_path:
        description: "Colon-separated ShellCheck -P source search path."
        required: false
        type: string
        default: "SCRIPTDIR:ush:ush/bash_utils:dev/ush"
      # Deterministic per-pillar downloadable artifact name override.
      artifact_name:
        description: "Downloadable artifact name (default: ci_artifact_bash)."
        required: false
        type: string
        default: "ci_artifact_bash"
      # Optional relative folder inside GITHUB_WORKSPACE to mirror ci_artifact.
      workspace_artifact_dir:
        description: "Optional relative folder in workspace to mirror ci_artifact."
        required: false
        type: string
        default: ""
  # Allow manual workflow dispatch from the GitHub Actions UI.
  workflow_dispatch:

# Enforce least-privilege read-only permissions at the workflow top level.
permissions:
  contents: read

# Define pinned tool versions, SHA-256 digests, and Node deprecation flags.
env:
  # Pinned ShellCheck release version for deterministic static analysis.
  SHELLCHECK_VERSION: "0.10.0"
  # Verified SHA-256 digest for shellcheck-v0.10.0.linux.x86_64.tar.xz.
  SHELLCHECK_SHA256: "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
  # Pinned reviewdog release version for local diagnostic rendering.
  REVIEWDOG_VERSION: "0.20.2"
  # Verified SHA-256 digest for reviewdog_0.20.2_Linux_x86_64.tar.gz.
  REVIEWDOG_SHA256: "25d0a8a0e64e50d84503332f498d2ab54979145ac97d5457e6b1dde79212e4ff"
  # Suppress Node.js runtime deprecation stderr warnings on runners.
  NODE_OPTIONS: "--no-deprecation"

jobs:
  # Single sandboxed analyzer job for Bash static checks and centralized log.
  bash-consistency-ci:
    # Execute on standard ephemeral GitHub-hosted Ubuntu runners.
    runs-on: ubuntu-latest
    # Restrict job token strictly to read-only repository contents.
    permissions:
      contents: read
    # Prevent hung runs from consuming runner minutes indefinitely.
    timeout-minutes: 15
    steps:
      # Check out caller repository with submodules disabled (SHA-pinned v7.0.0).
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Never clone external submodules during static shell linting.
          submodules: false

      # Restore cached binaries read-only on PRs to prevent cache poisoning.
      - name: Restore cached tools (PR read-only)
        id: cache-tools-pr
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache directory holding pinned shellcheck and reviewdog binaries.
          path: ~/.local/bin
          # Key cache strictly by OS, tool versions, and verified SHA-256 hashes.
          key: >-
            ${{ runner.os }}-nco-bash-tools-sc-${{ env.SHELLCHECK_VERSION }}-
            ${{ env.SHELLCHECK_SHA256 }}-rd-${{ env.REVIEWDOG_VERSION }}-
            ${{ env.REVIEWDOG_SHA256 }}

      # Restore and save cached binaries on trusted non-PR runs (push/dispatch).
      - name: Cache tools (non-PR read-write)
        id: cache-tools-rw
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache directory holding pinned shellcheck and reviewdog binaries.
          path: ~/.local/bin
          # Key cache strictly by OS, tool versions, and verified SHA-256 hashes.
          key: >-
            ${{ runner.os }}-nco-bash-tools-sc-${{ env.SHELLCHECK_VERSION }}-
            ${{ env.SHELLCHECK_SHA256 }}-rd-${{ env.REVIEWDOG_VERSION }}-
            ${{ env.REVIEWDOG_SHA256 }}

      # Install pinned ShellCheck and reviewdog with strict SHA-256 verification.
      - name: Ensure verified ShellCheck and reviewdog binaries
        shell: bash
        run: |
          # Enable strict error propagation and undefined-variable checks.
          set -euo pipefail
          # Target local binary installation directory.
          bin_dir="${HOME}/.local/bin"
          # Guard against regular file or broken symlink at ~/.local/bin.
          if [[ -e "${bin_dir}" || -L "${bin_dir}" ]] && [[ ! -d "${bin_dir}" ]]; then
            rm -f "${bin_dir}"
          fi
          # Create binary directory safely if it does not yet exist.
          if [[ ! -d "${bin_dir}" ]]; then
            mkdir -p "${bin_dir}"
          fi
          # Resolve temporary working directory for archive verification.
          dl_dir="${RUNNER_TEMP:-/tmp}/nco-bash-tool-dl"
          # Guard against file/symlink collisions at download directory.
          if [[ -e "${dl_dir}" || -L "${dl_dir}" ]] && [[ ! -d "${dl_dir}" ]]; then
            rm -f "${dl_dir}"
          fi
          # Create temporary download directory safely.
          if [[ ! -d "${dl_dir}" ]]; then
            mkdir -p "${dl_dir}"
          fi
          # Verify cached shellcheck binary or download and verify release archive.
          sc_bin="${bin_dir}/shellcheck"
          sc_stamp="${bin_dir}/.shellcheck.sha256"
          if [[ ! -x "${sc_bin}" ]] || ! sha256sum --check --strict "${sc_stamp}" >/dev/null 2>&1; then
            # Construct pinned GitHub release URL for ShellCheck.
            sc_tar="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
            sc_url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc_tar}"
            # Download pinned archive with HTTPS and retry protection.
            curl -fsSL --retry 3 "${sc_url}" -o "${dl_dir}/${sc_tar}"
            # Enforce cryptographic SHA-256 digest check before extraction.
            printf '%s  %s\n' "${SHELLCHECK_SHA256}" "${dl_dir}/${sc_tar}" | sha256sum --check --strict
            # Extract binary cleanly into temporary directory and install.
            tar -xJf "${dl_dir}/${sc_tar}" -C "${dl_dir}"
            install -m 0755 "${dl_dir}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${sc_bin}"
            # Record installed binary SHA-256 digest for cache-restore checks.
            sha256sum "${sc_bin}" > "${sc_stamp}"
          fi
          # Verify cached reviewdog binary or download and verify release archive.
          rd_bin="${bin_dir}/reviewdog"
          rd_stamp="${bin_dir}/.reviewdog.sha256"
          if [[ ! -x "${rd_bin}" ]] || ! sha256sum --check --strict "${rd_stamp}" >/dev/null 2>&1; then
            # Construct pinned GitHub release URL for reviewdog (no curl | sh).
            rd_tar="reviewdog_${REVIEWDOG_VERSION}_Linux_x86_64.tar.gz"
            rd_url="https://github.com/reviewdog/reviewdog/releases/download/v${REVIEWDOG_VERSION}/${rd_tar}"
            # Download pinned archive with HTTPS and retry protection.
            curl -fsSL --retry 3 "${rd_url}" -o "${dl_dir}/${rd_tar}"
            # Enforce cryptographic SHA-256 digest check before extraction.
            printf '%s  %s\n' "${REVIEWDOG_SHA256}" "${dl_dir}/${rd_tar}" | sha256sum --check --strict
            # Extract reviewdog binary cleanly and install with 0755 perms.
            tar -xzf "${dl_dir}/${rd_tar}" -C "${dl_dir}" reviewdog
            install -m 0755 "${dl_dir}/reviewdog" "${rd_bin}"
            # Record installed binary SHA-256 digest for cache-restore checks.
            sha256sum "${rd_bin}" > "${rd_stamp}"
          fi
          # Clean up temporary download archives after installation.
          rm -rf "${dl_dir}"
          # Export ~/.local/bin onto GITHUB_PATH for downstream steps.
          printf '%s\n' "${bin_dir}" >> "${GITHUB_PATH}"

      # Run Bash discovery, symlink containment, NCO rules, ShellCheck, and log.
      - name: Check Bash scripts and write centralized ci_artifact
        id: bash-check
        shell: bash
        env:
          # Pass GitHub event name safely via env (never raw interpolation).
          EVENT_NAME: ${{ github.event_name }}
          # Pass pull request number (empty on non-PR events).
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Pass pull request head commit SHA (empty on non-PR events).
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Pass maintainer-controlled PR labels as comma-delimited strings.
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          # Pass commit message for trusted push-event CI_IGNORE checks only.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          # Pass configurable exclusion file path from workflow_call or default.
          EXCLUDE_FILE: ${{ inputs.exclude_file || '.github/workflows/exclude_file_list_Bash.lst' }}
          # Pass configurable ShellCheck -P search path from workflow_call.
          SOURCE_PATH: ${{ inputs.source_path || 'SCRIPTDIR:ush:ush/bash_utils:dev/ush' }}
        run: |
          # Keep undefined-variable and pipeline errors strict; handle exit codes.
          set -uo pipefail
          # Resolve single centralized artifact staging directory (ci_artifact).
          out_dir="${RUNNER_TEMP:-/tmp}/ci_artifact"
          # Guard against regular file or broken symlink at staging directory.
          if [[ -e "${out_dir}" || -L "${out_dir}" ]] && [[ ! -d "${out_dir}" ]]; then
            rm -f "${out_dir}"
          fi
          # Create staging directory safely if absent.
          if [[ ! -d "${out_dir}" ]]; then
            mkdir -p "${out_dir}"
          fi
          # Initialize centralized log, kept skip files, and Checkstyle XMLs.
          ci_log="${out_dir}/ci_artifact_bash.log"
          excl_log="${out_dir}/excluded_files_from_list.txt"
          skip_log="${out_dir}/inline_skipped_directives.txt"
          xml_out="${out_dir}/shellcheck.checkstyle.xml"
          nco_xml="${out_dir}/nco_conventions.checkstyle.xml"
          nco_xml_body="${RUNNER_TEMP:-/tmp}/.nco_conventions.body"
          : > "${ci_log}"
          : > "${excl_log}"
          : > "${skip_log}"
          : > "${nco_xml_body}"
          # Initialize empty valid Checkstyle XML so reporter always sees XML.
          printf '<?xml version="1.0" encoding="UTF-8"?><checkstyle version="4.3"></checkstyle>\n' > "${xml_out}"
          # Write PR metadata files when running on a pull_request event.
          if [[ "${EVENT_NAME}" == "pull_request" && -n "${PR_NUMBER}" ]]; then
            printf '%s\n' "${PR_NUMBER}" > "${out_dir}/pr-number"
            printf '%s\n' "${PR_HEAD_SHA}" > "${out_dir}/pr-head-sha"
          fi
          # Helper to write every log message to stdout and centralized ci_log.
          log_msg() {
            printf '%s\n' "$1" | tee -a "${ci_log}"
          }
          # Emit trigger-context header as line 1 of ci_artifact_bash.log.
          wf_name="${GITHUB_WORKFLOW:-NCO_Consistency_Bash}"
          wf_sha="${GITHUB_SHA:-unknown}"
          log_msg "EVENT_CONTEXT: event=${EVENT_NAME} | workflow=${wf_name} | sha=${wf_sha}"
          # Helper to XML-escape untrusted file paths and messages portably.
          xml_escape() {
            awk 'BEGIN {
              s = ARGV[1];
              gsub(/&/, "\\&amp;", s);
              gsub(/</, "\\&lt;", s);
              gsub(/>/, "\\&gt;", s);
              gsub(/"/, "\\&quot;", s);
              gsub(/\047/, "\\&apos;", s);
              printf "%s", s;
            }' "$1"
          }
          # Helper to append an NCO convention/security finding as Checkstyle XML.
          add_nco_finding() {
            local fpath="$1" lnum="$2" sev="$3" rule="$4" msg="$5"
            printf '  <file name="%s"><error line="%s" column="1" ' \
              "$(xml_escape "${fpath}")" "$(xml_escape "${lnum}")" >> "${nco_xml_body}"
            printf 'severity="%s" message="%s" source="NCO.%s"/></file>\n' \
              "$(xml_escape "${sev}")" "$(xml_escape "${msg}")" \
              "$(xml_escape "${rule}")" >> "${nco_xml_body}"
          }
          # Resolve canonical workspace root for symlink containment checks.
          ws_root="$(realpath -e "${GITHUB_WORKSPACE:-$(pwd)}")"
          # Initialize global check enable flags (1 = enabled, 0 = skipped).
          run_shellcheck=1
          run_shebang=1
          run_setx=1
          run_exitzero=1
          # Enforce maintainer-gated CI_IGNORE: PRs use labels only, not PR text.
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # Convert comma-separated maintainer PR labels to lines for matching.
            label_lines="$(printf '%s' "${PR_LABELS}" | tr ',' '\n')"
            if printf '%s\n' "${label_lines}" | grep -ixq -- "ci-override:bash_shellcheck"; then
              run_shellcheck=0
              log_msg "GLOBAL_SKIP: bash_shellcheck | REASON: maintainer label ci-override:bash_shellcheck"
            fi
            if printf '%s\n' "${label_lines}" | grep -ixq -- "ci-override:shebang_script"; then
              run_shebang=0
              log_msg "GLOBAL_SKIP: shebang_script | REASON: maintainer label ci-override:shebang_script"
            fi
            if printf '%s\n' "${label_lines}" | grep -ixq -- "ci-override:bash_setx"; then
              run_setx=0
              log_msg "GLOBAL_SKIP: bash_setx | REASON: maintainer label ci-override:bash_setx"
            fi
            if printf '%s\n' "${label_lines}" | grep -ixq -- "ci-override:bash_exitzero"; then
              run_exitzero=0
              log_msg "GLOBAL_SKIP: bash_exitzero | REASON: maintainer label ci-override:bash_exitzero"
            fi
          else
            # On trusted push/dispatch events, honor commit-message CI_IGNORE.
            if printf '%s\n' "${COMMIT_MSG}" | grep -iq -- "bash_shellcheck"; then
              run_shellcheck=0
              log_msg "GLOBAL_SKIP: bash_shellcheck | REASON: trusted commit message CI_IGNORE"
            fi
            if printf '%s\n' "${COMMIT_MSG}" | grep -iq -- "shebang_script"; then
              run_shebang=0
              log_msg "GLOBAL_SKIP: shebang_script | REASON: trusted commit message CI_IGNORE"
            fi
            if printf '%s\n' "${COMMIT_MSG}" | grep -iq -- "bash_setx"; then
              run_setx=0
              log_msg "GLOBAL_SKIP: bash_setx | REASON: trusted commit message CI_IGNORE"
            fi
            if printf '%s\n' "${COMMIT_MSG}" | grep -iq -- "bash_exitzero"; then
              run_exitzero=0
              log_msg "GLOBAL_SKIP: bash_exitzero | REASON: trusted commit message CI_IGNORE"
            fi
          fi
          # Load exclusion list into directory prune array and O(1) exact map.
          declare -a exclude_dirs=()
          declare -A exclude_file_map=()
          if [[ -f "${EXCLUDE_FILE}" ]]; then
            while IFS= read -r raw_pat || [[ -n "${raw_pat}" ]]; do
              # Strip carriage returns and surrounding whitespace.
              pat="${raw_pat%$'\r'}"
              pat="${pat#"${pat%%[![:space:]]*}"}"
              pat="${pat%"${pat##*[![:space:]]}"}"
              # Skip blank lines and comment lines.
              [[ -z "${pat}" || "${pat}" == \#* ]] && continue
              # Record active exclusion rule in excluded_files_from_list.txt and ci_log.
              printf '%s\n' "${pat}" >> "${excl_log}"
              log_msg "EXCLUDED_RULE: ${pat}"
              # Normalize leading ./ prefix for uniform path matching.
              norm_pat="${pat#./}"
              if [[ "${norm_pat}" == *"/*" ]]; then
                exclude_dirs+=("${norm_pat%"/*"}")
              elif [[ "${norm_pat}" == *"/" ]]; then
                exclude_dirs+=("${norm_pat%"/"}")
              elif [[ -d "${norm_pat}" ]]; then
                exclude_dirs+=("${norm_pat}")
              else
                exclude_file_map["${norm_pat}"]="${pat}"
              fi
            done < "${EXCLUDE_FILE}"
          fi
          # Build dynamic find -prune expression (never descend excluded dirs).
          prune_args=( -path './.git' )
          for d in "${exclude_dirs[@]}"; do
            prune_args+=( -o -path "./${d}" )
          done
          # Discover candidate files WITHOUT -L to prevent blind symlink escape.
          mapfile -d '' all_candidates < <(
            find . \( "${prune_args[@]}" \) -prune -o \( -type f -o -type l \) \
              -not -iname '*.lua' -not -iname '*.yml' -not -iname '*.yaml' \
              -not -iname '*.j2' -not -iname '*.py' -not -iname '*.md' \
              -print0 | sort -zu
          )
          # Prepare array of validated Bash scripts eligible for ShellCheck.
          declare -a shellcheck_files=()
          failed=0
          # Evaluate every candidate file with symlink containment and single awk.
          for file in "${all_candidates[@]}"; do
            norm_file="${file#./}"
            # Enforce O(1) exact-file exclusion lookup before reading file.
            if [[ -n "${exclude_file_map[${norm_file}]+x}" ]]; then
              matched_rule="${exclude_file_map[${norm_file}]}"
              printf 'MATCHED_FILE: %s (pattern: %s)\n' "${norm_file}" "${matched_rule}" >> "${excl_log}"
              log_msg "SKIPPED_FILE: ${norm_file} | REASON: exclude_file_list (${matched_rule})"
              continue
            fi
            # Enforce strict workspace symlink containment via realpath -e.
            if [[ -L "${file}" ]]; then
              real_target="$(realpath -e -- "${file}" 2>/dev/null || true)"
              if [[ -z "${real_target}" || "${real_target}" != "${ws_root}/"* ]]; then
                log_msg "SKIPPED_FILE: ${norm_file} | REASON: security_symlink_outside_workspace"
                log_msg "FAIL (security_symlink): ${norm_file} points outside workspace"
                add_nco_finding "${norm_file}" "1" "error" "security_symlink" \
                  "Symlink points outside workspace"
                failed=1
                continue
              fi
              # Skip symlinks that resolve to directories rather than files.
              [[ -f "${real_target}" ]] || continue
            fi
            # Skip binary files safely using POSIX grep -I check.
            if ! grep -Iq . "${file}" 2>/dev/null && [[ -s "${file}" ]]; then
              log_msg "SKIPPED_FILE: ${norm_file} | REASON: binary_file"
              continue
            fi
            # Determine if path matches NCO/GFS Bash naming patterns.
            is_pattern_match=0
            case "${norm_file}" in
              jobs/*|scripts/*|dev/jobs/*|dev/scripts/*|*.sh|*.bash|*.SH|*.BASH)
                is_pattern_match=1 ;;
              */config.*|config.*|*/JG*|JG*|*.env)
                is_pattern_match=1 ;;
            esac
            # Single-pass awk extracts shebang, skips, set -x, and last code line.
            # Use ASCII 0x1F (non-whitespace) delimiter so empty fields never shift.
            awk_out="$(awk '
              BEGIN { first=""; has_setx=0; last_code=""; last_line=1;
                      skip_all=0; skip_sc=0; skip_sb=0; skip_sx=0; skip_ez=0; }
              {
                line = $0; sub(/\r$/, "", line);
                if (NR == 1) { first = line; }
                if (line ~ /^[[:space:]]*#[[:space:]]*(ci-ignore|ci-skip|shellcheck[[:space:]]+disable)[[:space:]:=]/) {
                  trimmed = line; sub(/^[[:space:]]+/, "", trimmed);
                  printf "SKIP_LINE\037%d\037%s\n", NR, trimmed;
                  low = tolower(trimmed);
                  if (low ~ /^#[[:space:]]*(ci-ignore|ci-skip):.*all([[:space:],]|$)/) skip_all = 1;
                  if (low ~ /^#[[:space:]]*(ci-ignore|ci-skip):.*bash_shellcheck/) skip_sc = 1;
                  if (low ~ /^#[[:space:]]*(ci-ignore|ci-skip):.*shebang_script/) skip_sb = 1;
                  if (low ~ /^#[[:space:]]*(ci-ignore|ci-skip):.*bash_setx/) skip_sx = 1;
                  if (low ~ /^#[[:space:]]*(ci-ignore|ci-skip):.*bash_exitzero/) skip_ez = 1;
                }
                clean = line; sub(/#.*/, "", clean);
                if (clean ~ /(^|[;[:space:]])set([[:space:]]+|$)/ &&
                    clean ~ /(-[a-zA-Z0-9]*x[a-zA-Z0-9]*|-o[[:space:]]+xtrace)/) {
                  has_setx = 1;
                }
                if (clean !~ /^[[:space:]]*$/) { last_code = clean; last_line = NR; }
              }
              END {
                printf "META\037%s\037%d\037%d\037%d\037%d\037%d\037%d\037%d\037%s\n",
                  first, has_setx, skip_all, skip_sc, skip_sb, skip_sx, skip_ez, last_line, last_code;
              }
            ' "${file}")"
            # Parse single-pass awk output safely using non-whitespace 0x1F IFS.
            first_line=""
            has_setx=0
            skip_all=0
            skip_sc=0
            skip_sb=0
            skip_sx=0
            skip_ez=0
            last_line=1
            last_code=""
            declare -a file_skip_lines=()
            while IFS=$'\x1f' read -r tag col1 col2 col3 col4 col5 col6 col7 col8 col9; do
              if [[ "${tag}" == "SKIP_LINE" ]]; then
                file_skip_lines+=("${col1}:${col2}")
              elif [[ "${tag}" == "META" ]]; then
                first_line="${col1}"
                has_setx="${col2}"
                skip_all="${col3}"
                skip_sc="${col4}"
                skip_sb="${col5}"
                skip_sx="${col6}"
                skip_ez="${col7}"
                last_line="${col8}"
                last_code="${col9}"
              fi
            done <<< "${awk_out}"
            # Check if file qualifies via line-1 shell shebang (#!...sh).
            is_shebang_match=0
            if [[ "${first_line}" =~ ^#!.*sh([[:space:]]|$) ]]; then
              is_shebang_match=1
            fi
            # Skip non-Bash files outside naming patterns without a sh shebang.
            if (( is_pattern_match == 0 && is_shebang_match == 0 )); then
              continue
            fi
            # Record every file:line inline skip in inline_skipped_directives.txt and ci_log.
            for sl in "${file_skip_lines[@]}"; do
              sl_num="${sl%%:*}"
              sl_txt="${sl#*:}"
              printf '%s:%s:%s\n' "${norm_file}" "${sl_num}" "${sl_txt}" >> "${skip_log}"
              log_msg "SKIPPED_LINE: ${norm_file}:${sl_num} | DIRECTIVE: ${sl_txt}"
            done
            # Honor inline # ci-skip: all / # ci-ignore: all directive.
            if (( skip_all == 1 )); then
              log_msg "SKIPPED_FILE: ${norm_file} | REASON: inline_skip_all"
              continue
            fi
            # Track active checks applied to this Bash script.
            active_checks=()
            # Evaluate ShellCheck eligibility for this file.
            if (( run_shellcheck == 1 && skip_sc == 0 )); then
              shellcheck_files+=("${file}")
              active_checks+=("bash_shellcheck")
            else
              log_msg "SKIPPED_CHECK: ${norm_file} | CHECK: bash_shellcheck"
            fi
            # Evaluate NCO shebang_script rule (must start with #!/bin/bash).
            if (( run_shebang == 1 && skip_sb == 0 )); then
              active_checks+=("shebang_script")
              trimmed_first="${first_line%"${first_line##*[![:space:]]}"}"
              if [[ "${trimmed_first}" != "#!/bin/bash" ]]; then
                log_msg "FAIL (shebang_script): ${norm_file}:1 expected #!/bin/bash"
                add_nco_finding "${norm_file}" "1" "error" "shebang_script" \
                  "Expected #!/bin/bash on line 1"
                failed=1
              fi
            else
              log_msg "SKIPPED_CHECK: ${norm_file} | CHECK: shebang_script"
            fi
            # Evaluate NCO bash_setx rule (must enable set -x or -o xtrace).
            if (( run_setx == 1 && skip_sx == 0 )); then
              active_checks+=("bash_setx")
              if (( has_setx == 0 )); then
                log_msg "FAIL (bash_setx): ${norm_file}:1 missing set -x / -o xtrace"
                add_nco_finding "${norm_file}" "1" "error" "bash_setx" \
                  "Missing set -x or set -o xtrace"
                failed=1
              fi
            else
              log_msg "SKIPPED_CHECK: ${norm_file} | CHECK: bash_setx"
            fi
            # Evaluate NCO bash_exitzero rule (forbid trailing exit 0).
            if (( run_exitzero == 1 && skip_ez == 0 )); then
              active_checks+=("bash_exitzero")
              if [[ "${last_code}" =~ ^[[:space:]]*exit[[:space:]]+0([[:space:]]*|;.*)?$ ]]; then
                log_msg "FAIL (bash_exitzero): ${norm_file}:${last_line} ends with exit 0"
                add_nco_finding "${norm_file}" "${last_line}" "error" "bash_exitzero" \
                  "Unconditional trailing exit 0 is forbidden"
                failed=1
              fi
            else
              log_msg "SKIPPED_CHECK: ${norm_file} | CHECK: bash_exitzero"
            fi
            # Record exact checked file and list of checks applied.
            log_msg "CHECKED_FILE: ${norm_file} | CHECKS: ${active_checks[*]:-none}"
          done
          # Finalize nco_conventions.checkstyle.xml and clean up temp body file.
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n'
            printf '<checkstyle version="4.3">\n'
            cat "${nco_xml_body}"
            printf '</checkstyle>\n'
          } > "${nco_xml}"
          rm -f "${nco_xml_body}"
          # Define NCO standard ShellCheck exclusion codes (30 codes).
          SC_EXC="SC1090,SC1091,SC2001,SC2002,SC2012,SC2015,SC2016,SC2027,SC2034,"
          SC_EXC+="SC2046,SC2053,SC2064,SC2068,SC2086,SC2115,SC2129,SC2145,SC2153,"
          SC_EXC+="SC2154,SC2155,SC2162,SC2164,SC2181,SC2206,SC2207,SC2230,SC2236,"
          SC_EXC+="SC2249,SC2250,SC2312"
          # Execute single-pass ShellCheck in Checkstyle XML format.
          if (( ${#shellcheck_files[@]} > 0 )); then
            sc_rc=0
            sc_err_tmp="${RUNNER_TEMP:-/tmp}/.shellcheck.stderr"
            : > "${sc_err_tmp}"
            shellcheck --shell=bash --enable=all --exclude="${SC_EXC}" \
              -P "${SOURCE_PATH}" -x -f checkstyle "${shellcheck_files[@]}" \
              > "${xml_out}" 2> "${sc_err_tmp}" || sc_rc=$?
            # Append any ShellCheck stderr directly to centralized ci_log.
            if [[ -s "${sc_err_tmp}" ]]; then
              log_msg "FAIL (bash_shellcheck_stderr): $(tr '\n' ' ' < "${sc_err_tmp}")"
            fi
            rm -f "${sc_err_tmp}"
            # Always record explicit failure line in ci_log if sc_rc != 0.
            if (( sc_rc != 0 )); then
              log_msg "FAIL (bash_shellcheck): shellcheck exited with code ${sc_rc}"
              failed=1
            fi
          fi
          # Render ALL Checkstyle XML findings unfiltered into centralized ci_log.
          for xml_f in "${xml_out}" "${nco_xml}"; do
            if [[ -s "${xml_f}" ]]; then
              rd_name="$(basename "${xml_f}" .checkstyle.xml)"
              reviewdog -f=checkstyle -name="${rd_name}" -reporter=local \
                -filter-mode=nofilter -fail-level=none < "${xml_f}" \
                2>&1 | tee -a "${ci_log}" || true
            fi
          done
          # Record final exit status in centralized ci_log before returning.
          log_msg "SUMMARY: bash-check exiting with status ${failed}"
          exit "${failed}"

      # Optionally mirror staged ci_artifact into a validated workspace folder.
      - name: Mirror ci_artifact into workspace folder
        id: mirror-artifact
        if: ${{ always() && inputs.workspace_artifact_dir != '' }}
        shell: bash
        env:
          # Pass caller-configured relative workspace folder safely via env.
          MIRROR_DIR: ${{ inputs.workspace_artifact_dir }}
        run: |
          # Enable strict error propagation for security containment checks.
          set -euo pipefail
          # Source staging directory remains ${RUNNER_TEMP}/ci_artifact.
          src_dir="${RUNNER_TEMP:-/tmp}/ci_artifact"
          ci_log="${src_dir}/ci_artifact_bash.log"
          # Skip mirroring cleanly if no staged artifact directory exists.
          [[ -d "${src_dir}" ]] || exit 0
          # Trim leading ./ and trailing / from configured relative path.
          rel_dir="${MIRROR_DIR#./}"
          rel_dir="${rel_dir%/}"
          # Reject empty, absolute, backslash, parent-traversal, or .git paths.
          if [[ -z "${rel_dir}" || "${rel_dir}" == /* || "${rel_dir}" == *\\* ]]; then
            echo "Security error: workspace_artifact_dir must be a relative path."
            exit 1
          fi
          if [[ "${rel_dir}" == ".." || "${rel_dir}" == *"../"* || "${rel_dir}" == *"/.." ]]; then
            echo "Security error: workspace_artifact_dir cannot contain '..'."
            exit 1
          fi
          if [[ "${rel_dir}" == ".git" || "${rel_dir}" == ".git/"* || "${rel_dir}" == *"/.git"* ]]; then
            echo "Security error: workspace_artifact_dir cannot target .git."
            exit 1
          fi
          # Verify target path resolves strictly inside GITHUB_WORKSPACE.
          ws_root="$(realpath -e "${GITHUB_WORKSPACE:-$(pwd)}")"
          target_dir="$(realpath -m -- "${ws_root}/${rel_dir}")"
          if [[ "${target_dir}" != "${ws_root}/"* ]]; then
            echo "Security error: workspace_artifact_dir escapes GITHUB_WORKSPACE."
            exit 1
          fi
          # Guard against regular file or symlink collision at target_dir.
          if [[ -e "${target_dir}" || -L "${target_dir}" ]] && [[ ! -d "${target_dir}" ]]; then
            rm -f "${target_dir}"
          fi
          # Create target directory safely inside workspace.
          if [[ ! -d "${target_dir}" ]]; then
            mkdir -p "${target_dir}"
          fi
          # Re-verify canonical path after creation to block symlink traversal.
          real_target="$(realpath -e -- "${target_dir}")"
          if [[ "${real_target}" != "${ws_root}/"* ]]; then
            echo "Security error: resolved mirror directory escapes workspace."
            exit 1
          fi
          # Record mirror location in ci_artifact_bash.log before copying.
          if [[ -f "${ci_log}" ]]; then
            printf 'MIRRORED_ARTIFACT: %s\n' "${rel_dir}" | tee -a "${ci_log}"
          fi
          # Copy only regular files from ${RUNNER_TEMP}/ci_artifact to workspace.
          find "${src_dir}" -maxdepth 1 -type f -exec cp -f -t "${real_target}" -- {} +

      # Display ci_artifact_bash.log directly on the GitHub Actions run page.
      - name: Write GitHub Step Summary
        if: ${{ always() }}
        shell: bash
        run: |
          # Enable strict error checking for summary emission.
          set -euo pipefail
          # Locate centralized log file inside ci_artifact staging directory.
          ci_log="${RUNNER_TEMP:-/tmp}/ci_artifact/ci_artifact_bash.log"
          # Render log content directly onto the workflow run summary page.
          {
            echo "## NCO Consistency Bash CI (ci_artifact_bash.log)"
            echo '```text'
            if [[ -f "${ci_log}" ]]; then
              cat "${ci_log}"
            else
              echo "No centralized log generated (workflow aborted early)."
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Upload downloadable ci_artifact_bash on the workflow run page.
      - name: Upload downloadable ci_artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Deterministic per-pillar artifact name (default: ci_artifact_bash).
          name: ${{ inputs.artifact_name || 'ci_artifact_bash' }}
          # Upload ci_artifact directory (log, skip files, XMLs, PR metadata).
          path: ${{ runner.temp }}/ci_artifact
          # Warn instead of failing if an early step aborted before staging.
          if-no-files-found: warn
          # Exclude hidden temporary files from the downloadable zip.
          include-hidden-files: false
          # Retain downloadable ci_artifact for 14 days.
          retention-days: 14
